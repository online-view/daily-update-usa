<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCUBsazHzsb4HUeu4sg3cWRRJFGJGbK1-Q",
  authDomain: "daily-update-usa.firebaseapp.com",
  projectId: "daily-update-usa",
  storageBucket: "daily-update-usa.firebasestorage.app",
  messagingSenderId: "342674212806",
  appId: "1:342674212806:web:be76407ad95f47c72ed4c7"
};
const db = getFirestore(initializeApp(firebaseConfig));

document.getElementById("today").textContent = new Date().toLocaleDateString("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
document.getElementById("yr").textContent = new Date().getFullYear();

const status = document.getElementById("status");
const zones = ["news-a","news-a","news-b","news-b","news-c"].map(id => document.getElementById(id));

onSnapshot(collection(db, "news"), snap => {
  const items = [];
  snap.forEach(d => { const x = d.data(); x.slot = Number(d.id.replace("slot","")); items.push(x); });
  items.sort((a,b) => a.slot - b.slot);
  new Set(zones).forEach(z => z.innerHTML = "");
  if(!items.length){ status.style.display="block"; status.textContent="No news yet. Please check back soon."; return; }
  status.style.display = "none";
  items.slice(0,5).forEach((n, i) => {
    const s = document.createElement("article"); s.className = "story";
    const t = document.createElement("div"); t.className = "txt";
    const h = document.createElement("h3"); h.textContent = n.title || "";
    const tm = document.createElement("time");
    if(n.updatedAt && n.updatedAt.toDate) tm.textContent = n.updatedAt.toDate().toLocaleString("en-US",{dateStyle:"medium",timeStyle:"short"});
    const p = document.createElement("p"); p.textContent = n.content || "";
    t.append(h, tm, p); s.appendChild(t);
    if(n.imageUrl){
      const pic = document.createElement("div"); pic.className = "pic";
      const im = document.createElement("img"); im.src = n.imageUrl; im.alt = n.title || "News image"; im.loading = "lazy";
      pic.appendChild(im); s.appendChild(pic);
    }
    zones[i].appendChild(s);
  });
}, err => { status.style.display="block"; status.textContent="Could not load news. Please refresh the page."; console.error(err); });
</script>
